project_id = "bdo-companion"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://localhost:5173/auth/reset", "http://127.0.0.1:5173/auth/callback", "http://127.0.0.1:5173/auth/reset", "com.jimmicha.bdocompanion://auth/callback", "com.jimmicha.bdocompanion://auth/reset"]
jwt_expiry = 3600
enable_signup = true
enable_manual_linking = true
minimum_password_length = 10
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"
[functions.delete-account]
verify_jwt = true
