name: Encrypted daily backup
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: beta-backups
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_DIR: .local/backups
      DELETION_LEDGER_FILE: .local/backups/latest-deletion-ledger.enc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select PostgreSQL 17 tools
        run: |
          test -x /usr/lib/postgresql/17/bin/pg_dump
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: node scripts/reconcile-deletions.mjs
      - run: node scripts/backup.mjs
      - run: node scripts/export-deletion-ledger.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-backup-${{ github.run_id }}
          path: .local/backups/*.enc
          include-hidden-files: true
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
